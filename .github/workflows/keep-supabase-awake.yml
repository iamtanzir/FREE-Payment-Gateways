name: Keep Supabase awake

# Supabase Free pauses a project after ~7 days without activity.
# This workflow pings the REST endpoint every 3 days so the dashboard stays online.
# Repo → Settings → Secrets and variables → Actions: add SUPABASE_URL + SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_ANON_KEY in repository secrets."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          test "$code" -ge 200 -a "$code" -lt 500
