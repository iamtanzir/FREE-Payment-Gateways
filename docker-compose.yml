services:
  gateway:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # Set this to your public domain once deployed, e.g. https://pay.yourdomain.com
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_PATH: /app/data/fpg.db
      # Optional: external Postgres (Neon/Aiven/CockroachDB). When set, the app
      # stores everything there and survives restarts/redeploys. Leave empty to
      # keep using the SQLite volume below.
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - fpg-data:/app/data
    restart: unless-stopped

volumes:
  fpg-data:
